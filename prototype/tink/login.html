<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>tink · log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="frame.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth">
    <div class="spacer auth__spacer--top"></div>

    <a class="back" href="home.html" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12H4m0 0 7-7m-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="spacer auth__spacer--middle"></div>

    <form class="auth__form" id="login-form" novalidate>
      <h1 class="auth__title">welcome back!</h1>
      <p class="auth__subtitle">please enter your password to continue</p>

      <label class="field-label" for="email">email address</label>
      <div class="field">
        <input class="field__input" id="email" name="email" type="email" value="nilathomasissac@gmail.com" autocomplete="email" readonly />
        <button class="field__action field__action--text" id="edit-email" type="button">edit</button>
      </div>

      <label class="field-label field-label--spaced" for="password">password</label>
      <div class="field" id="password-field">
        <input class="field__input" id="password" name="password" type="password" autocomplete="current-password" required />
        <button class="field__action" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
          <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 10s3.6 5 10 5 10-5 10-5M5.5 13.2 4 15.5m14.5-2.3 1.5 2.3M9.5 14.8 9 17.5m5.5-2.7.5 2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
      </div>
      <p class="field-error" id="password-error" role="alert" hidden>please enter your password</p>

      <a class="link" id="forgot-password" href="#forgot-password">forgot password?</a>

      <button class="btn btn--primary" id="continue-btn" type="submit">continue</button>
    </form>

    <div class="spacer auth__spacer--bottom"></div>
  </main>

  <script src="login.js"></script>
</body>
</html>
