<!DOCTYPE html>
<html lang="en">
<head>

  <title>tink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

        </svg>

      <a class="btn btn--outline" id="login-btn" href="login.html">

      </a>

      <a class="try-first" id="try-first" href="chat.html">try first</a>
    </nav>

    <div class="spacer spacer--bottom"></div>

  <script src="main.js"></script>

</html>
