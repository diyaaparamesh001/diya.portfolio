<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>tink · profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="frame.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="screens.css" />
</head>
<body>
  <main class="screen">
    <a class="back" href="chat.html?drawer=1" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12H4m0 0 7-7m-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="avatar">
      <span class="avatar__initials" aria-hidden="true">NT</span>
      <button class="avatar__badge" type="button" aria-label="Change profile photo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 8.5A1.5 1.5 0 0 1 5 7h2.5l1.5-2h5l1.5 2H18a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 18 19H5a1.5 1.5 0 0 1-1.5-1.5Z" />
          <circle cx="11.5" cy="13" r="3" />
          <path d="M19.5 3v3M18 4.5h3" />
        </svg>
      </button>
    </div>

    <h1 class="profile__name">Nila Thomas</h1>
    <p class="profile__email">nilathomasissac@gmail.com</p>

    <ul class="list">
      <li>
        <a class="row" href="password.html">
          <svg class="row__icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10.5" width="14" height="10.5" rx="1.5" />
            <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
            <circle cx="12" cy="15.5" r="1.3" fill="currentColor" stroke="none" />
          </svg>
          <span class="row__label">change password</span>
          <svg class="row__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m0 0-6.5-6.5M20 12l-6.5 6.5" /></svg>
        </a>
      </li>
      <li>
        <button class="row" type="button" data-todo="invite">
          <svg class="row__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 3.5h16M4 20.5h16" />
            <rect x="4" y="6" width="16" height="12" rx="1" />
            <circle cx="12" cy="10.5" r="2.2" />
            <path d="M8 16a4 4 0 0 1 8 0" />
          </svg>
          <span class="row__label">invite a friend</span>
          <svg class="row__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m0 0-6.5-6.5M20 12l-6.5 6.5" /></svg>
        </button>
      </li>
      <li>
        <button class="row" type="button" data-todo="help">
          <svg class="row__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5" />
            <path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.9" />
            <circle cx="12" cy="17.3" r="0.6" fill="currentColor" />
          </svg>
          <span class="row__label">help</span>
          <svg class="row__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m0 0-6.5-6.5M20 12l-6.5 6.5" /></svg>
        </button>
      </li>
    </ul>
  </main>
</body>
</html>
