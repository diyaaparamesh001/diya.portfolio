<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>tink · change password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="frame.js"></script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="screens.css" />
</head>
<body>
  <main class="screen">
    <a class="back" href="profile.html" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 12H4m0 0 7-7m-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <form class="pw" id="pw-form" novalidate>
      <h1 class="pw__title">change your password</h1>
      <p class="pw__subtitle">your email address is nilathomasissac@gmail.com</p>

      <div class="pw__fields">
        <label class="field-label" for="current-password">current password</label>
        <div class="field">
          <input class="field__input" id="current-password" type="password" autocomplete="current-password" />
          <button class="field__action" type="button" aria-label="Show password" aria-pressed="false" data-toggle="current-password">
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 10s3.6 5 10 5 10-5 10-5M5.5 13.2 4 15.5m14.5-2.3 1.5 2.3M9.5 14.8 9 17.5m5.5-2.7.5 2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <label class="field-label" for="new-password">new password</label>
        <div class="field">
          <input class="field__input" id="new-password" type="password" autocomplete="new-password" />
          <button class="field__action" type="button" aria-label="Show password" aria-pressed="false" data-toggle="new-password">
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 10s3.6 5 10 5 10-5 10-5M5.5 13.2 4 15.5m14.5-2.3 1.5 2.3M9.5 14.8 9 17.5m5.5-2.7.5 2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <label class="field-label" for="confirm-password">confirm new password</label>
        <div class="field">
          <input class="field__input" id="confirm-password" type="password" autocomplete="new-password" />
          <button class="field__action" type="button" aria-label="Show password" aria-pressed="false" data-toggle="confirm-password">
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 10s3.6 5 10 5 10-5 10-5M5.5 13.2 4 15.5m14.5-2.3 1.5 2.3M9.5 14.8 9 17.5m5.5-2.7.5 2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <p class="pw__error" id="pw-error" role="alert" hidden></p>
      </div>
    </form>

    <button class="pw__submit" type="submit" form="pw-form">update password</button>

    <p class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast__check" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>
      </span>
      <span id="toast-text"></span>
    </p>
  </main>

  <script src="password.js"></script>
</body>
</html>
